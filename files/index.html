<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office Hours</title>
<style>
  :root {
    --bg: #f6f5f3;
    --panel: #ffffff;
    --ink: #1c1c1e;
    --muted: #6b6b70;
    --line: #e6e4e0;
    --accent: #3454d1;
    --alert: #b3261e;
    --alert-bg: #fdecea;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    max-width: 760px;
    margin: 48px auto;
    padding: 0 20px 80px;
    background: var(--bg);
    color: var(--ink);
  }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 0.9rem; }

  #badge {
    display: inline-block;
    font-size: 0.75rem;
    padding: 3px 9px;
    border-radius: 20px;
    background: #eee;
    color: var(--muted);
    margin-bottom: 20px;
  }
  #badge.mock { background: #eef2ff; color: var(--accent); }
  #badge.live { background: #e8f5e9; color: #1b5e20; }
  #badge.replay { background: #fff3e0; color: #8a5300; }

  textarea {
    width: 100%; height: 76px; font-size: 1rem; padding: 12px;
    border: 1px solid var(--line); border-radius: 10px; resize: vertical;
    font-family: inherit; background: var(--panel);
  }
  textarea:focus { outline: 2px solid var(--accent); }

  .row { display: flex; gap: 10px; margin-top: 10px; align-items: center; }
  button {
    padding: 10px 18px; font-size: 0.95rem; cursor: pointer;
    border: none; border-radius: 8px; background: var(--accent); color: white;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  #loading { color: var(--muted); font-size: 0.9rem; display: none; }

  #headline { font-size: 1.15rem; font-weight: 600; margin: 28px 0 4px; }
  #speech { color: var(--muted); margin: 0 0 20px; }

  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px 18px; margin-bottom: 14px;
  }
  .card h3 { margin: 0 0 10px; font-size: 1rem; }
  .card.alert { background: var(--alert-bg); border-color: #f3c9c6; }
  .card.alert h3 { color: var(--alert); }

  ul.items { list-style: none; margin: 0; padding: 0; }
  ul.items li {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 0.92rem;
  }
  ul.items li:last-child { border-bottom: none; }
  .item-main { flex: 1; }
  .item-course { color: var(--muted); font-size: 0.82rem; margin-left: 6px; }
  .item-due { color: var(--muted); font-size: 0.82rem; white-space: nowrap; }
  .prio { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 7px; }
  .prio-3 { background: var(--alert); }
  .prio-2 { background: #d99a00; }
  .prio-1, .prio-0 { background: #9aa0a6; }

  table.blocks { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  table.blocks th, table.blocks td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  table.blocks th { color: var(--muted); font-weight: 500; font-size: 0.8rem; }

  .section { margin-bottom: 14px; }
  .section:last-child { margin-bottom: 0; }
  .section h4 { margin: 0 0 4px; font-size: 0.92rem; }
  .section p { margin: 0 0 6px; font-size: 0.88rem; color: var(--ink); }
  .section ul { margin: 0; padding-left: 18px; font-size: 0.85rem; color: var(--muted); }

  .series-label { font-size: 0.82rem; color: var(--muted); margin-bottom: 4px; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
  .bar-x { width: 68px; font-size: 0.75rem; color: var(--muted); flex-shrink: 0; }
  .bar-track { flex: 1; background: var(--line); border-radius: 4px; height: 10px; overflow: hidden; }
  .bar-fill { background: var(--accent); height: 100%; }
  .bar-y { width: 34px; font-size: 0.75rem; color: var(--muted); text-align: right; flex-shrink: 0; }

  .card.text p, .card.alert p { margin: 0; font-size: 0.92rem; white-space: pre-wrap; }

  details#trace { margin-top: 26px; font-size: 0.85rem; color: var(--muted); }
  details#trace summary { cursor: pointer; }
  details#trace .step {
    border-left: 2px solid var(--line); padding: 6px 0 6px 10px; margin-top: 6px;
  }
  details#trace .step.err { border-left-color: var(--alert); }
  details#trace code { font-size: 0.78rem; }

  #error-box {
    background: var(--alert-bg); color: var(--alert); border-radius: 10px;
    padding: 12px 16px; margin-top: 20px; font-size: 0.92rem; display: none;
  }
</style>
</head>
<body>
  <h1>Office Hours</h1>
  <p class="sub">Ask about your coursework, schedule, or campus events.</p>
  <span id="badge">checking backend&hellip;</span>

  <textarea id="prompt-input" placeholder="e.g. What's due for me this week?"></textarea>
  <div class="row">
    <button id="submit-btn">Ask</button>
    <span id="loading">Thinking&hellip;</span>
  </div>

  <div id="error-box"></div>
  <div id="headline"></div>
  <p id="speech"></p>
  <div id="cards"></div>
  <details id="trace" style="display:none;">
    <summary>How it got this answer</summary>
    <div id="trace-body"></div>
  </details>

<script>
const submitBtn = document.getElementById("submit-btn");
const promptInput = document.getElementById("prompt-input");
const loading = document.getElementById("loading");
const errorBox = document.getElementById("error-box");
const headlineEl = document.getElementById("headline");
const speechEl = document.getElementById("speech");
const cardsEl = document.getElementById("cards");
const traceEl = document.getElementById("trace");
const traceBody = document.getElementById("trace-body");
const badge = document.getElementById("badge");

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}

async function checkHealth() {
  try {
    const res = await fetch("/api/health");
    const data = await res.json();
    if (data.ok) {
      badge.textContent = `backend ok · ${data.mode} mode`;
      badge.className = data.mode;
    } else {
      badge.textContent = "backend unreachable";
      badge.className = "";
    }
  } catch (err) {
    badge.textContent = "backend unreachable";
    badge.className = "";
  }
}
checkHealth();

function renderAssignmentList(card) {
  const rows = (card.items || []).map(it => `
    <li>
      <span class="item-main">
        <span class="prio prio-${Number(it.priority) || 0}"></span>
        ${esc(it.title)}<span class="item-course">${esc(it.course || "")}</span>
      </span>
      <span class="item-due">${esc(it.due || "")}</span>
    </li>`).join("");
  return `<h3>${esc(card.title)}</h3><ul class="items">${rows || "<li>Nothing here.</li>"}</ul>`;
}

function renderEventList(card) {
  const rows = (card.items || []).map(it => `
    <li>
      <span class="item-main">${esc(it.title)}</span>
      <span class="item-due">${esc(it.when || "")}${it.where ? " · " + esc(it.where) : ""}</span>
    </li>`).join("");
  return `<h3>${esc(card.title)}</h3><ul class="items">${rows || "<li>Nothing here.</li>"}</ul>`;
}

function renderSchedule(card) {
  const rows = (card.blocks || []).map(b => `
    <tr>
      <td>${esc(b.day)}</td>
      <td>${esc(b.start)}&ndash;${esc(b.end)}</td>
      <td>${esc(b.task)}</td>
      <td>${esc(b.est_minutes)}m</td>
    </tr>`).join("");
  return `<h3>${esc(card.title)}</h3>
    <table class="blocks">
      <thead><tr><th>Day</th><th>Time</th><th>Task</th><th>Est.</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="4">No blocks.</td></tr>'}</tbody>
    </table>`;
}

function renderStudySet(card) {
  const sections = (card.sections || []).map(s => `
    <div class="section">
      <h4>${esc(s.topic)}</h4>
      <p>${esc(s.summary)}</p>
      ${(s.questions || []).length ? `<ul>${s.questions.map(q => `<li>${esc(q)}</li>`).join("")}</ul>` : ""}
    </div>`).join("");
  return `<h3>${esc(card.title)}</h3>${sections || "<p>No sections.</p>"}`;
}

function renderWorkloadChart(card) {
  const series = (card.series || []).map(s => {
    const maxY = Math.max(1, ...s.points.map(p => Number(p.y) || 0));
    const bars = s.points.map(p => {
      const pct = Math.max(2, (Number(p.y) || 0) / maxY * 100);
      return `<div class="bar-row">
        <span class="bar-x">${esc(p.x)}</span>
        <span class="bar-track"><span class="bar-fill" style="width:${pct}%"></span></span>
        <span class="bar-y">${esc(p.y)}</span>
      </div>`;
    }).join("");
    return `<div class="series-label">${esc(s.label)}</div>${bars}`;
  }).join("<br>");
  return `<h3>${esc(card.title)}</h3>${series || "<p>No data yet.</p>"}`;
}

function renderTextOrAlert(card) {
  return `<h3>${esc(card.title)}</h3><p>${esc(card.body)}</p>`;
}

const RENDERERS = {
  assignment_list: renderAssignmentList,
  event_list: renderEventList,
  schedule: renderSchedule,
  study_set: renderStudySet,
  workload_chart: renderWorkloadChart,
  text: renderTextOrAlert,
  alert: renderTextOrAlert,
};

function renderCards(cards) {
  cardsEl.innerHTML = (cards || []).map(card => {
    const fn = RENDERERS[card.type];
    const inner = fn ? fn(card) : `<h3>${esc(card.title || card.type)}</h3><p>Unknown card type.</p>`;
    return `<div class="card ${esc(card.type)}">${inner}</div>`;
  }).join("");
}

function renderTrace(trace) {
  if (!trace || !trace.steps || !trace.steps.length) {
    traceEl.style.display = "none";
    return;
  }
  traceEl.style.display = "block";
  traceBody.innerHTML = trace.steps.map(s => `
    <div class="step ${s.ok ? "" : "err"}">
      <code>${esc(s.tool)}</code> — ${s.ok ? "ok" : "error"}, ${esc(s.ms)}ms
      <div>${esc(s.result_preview)}</div>
    </div>`).join("") + `<div style="margin-top:8px;">${trace.turns} turn(s) · ${trace.elapsed_ms}ms total${trace.replayed ? " · replayed" : ""}</div>`;
}

async function ask() {
  const promptText = promptInput.value.trim();
  if (!promptText) return;

  loading.style.display = "inline";
  submitBtn.disabled = true;
  errorBox.style.display = "none";
  headlineEl.textContent = "";
  speechEl.textContent = "";
  cardsEl.innerHTML = "";
  traceEl.style.display = "none";

  try {
    const res = await fetch("/api/prompt", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt: promptText, context: { student_id: "demo-student" } }),
    });
    const data = await res.json();

    if (data.error) {
      errorBox.textContent = data.error;
      errorBox.style.display = "block";
      return;
    }

    const display = data.display || {};
    headlineEl.textContent = display.headline || "";
    speechEl.textContent = display.speech || data.summary || "";
    renderCards(display.cards);
    renderTrace(data.trace);
  } catch (err) {
    errorBox.textContent = "Something went wrong: " + err;
    errorBox.style.display = "block";
  } finally {
    loading.style.display = "none";
    submitBtn.disabled = false;
  }
}

submitBtn.addEventListener("click", ask);
promptInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) ask();
});
</script>
</body>
</html>
